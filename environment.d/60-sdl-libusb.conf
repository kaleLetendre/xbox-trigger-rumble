# Let SDL (incl. the Steam client's bundled SDL3) open any controller over
# libusb, not just its built-in short list. Needed for SDL's GIP driver to
# own wired Xbox One/Series pads and drive the impulse-trigger motors.
# Read by systemd --user at login. Covers systemd-managed sessions (GNOME/KDE
# Wayland); X11 sessions like XFCE need ~/.xprofile instead (install.sh does both).
SDL_HIDAPI_LIBUSB_WHITELIST=0
