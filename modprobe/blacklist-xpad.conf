# Keep the in-kernel xpad driver from auto-loading, so SDL (Steam) can own
# Xbox One/Series pads over libusb and drive the impulse-trigger motors.
# xpad starts the pad as soon as it's plugged in, so SDL never gets the GIP
# "hello". SDL then resets the pad, the pad re-enumerates, and xpad grabs it
# again. A one-time unbind doesn't survive that loop.
# Side effect: every Xbox pad on this machine works only through SDL/Steam,
# with no /dev/input/js* or event* node.
blacklist xpad
